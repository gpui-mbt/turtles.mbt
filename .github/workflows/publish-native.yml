name: Publish native executables for moon-binstall

on:
  pull_request:
    paths:
      - ".github/workflows/publish-native.yml"
  push:
    tags:
      - "v*"
      - "latest"

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release_ref: ${{ steps.resolve.outputs.release_ref }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref == 'refs/tags/latest' && 'main' || github.sha }}
      - name: Test version bump logic
        run: python3 -m unittest discover -s scripts/tests -p 'test_release_version.py' -v
      - name: Prepare immutable version tag
        id: resolve
        env:
          RELEASE_KIND: turtles
        shell: bash
        run: |
          set -euo pipefail
          release_tag=""
          release_ref="$(git rev-parse HEAD)"
          if [[ "$GITHUB_REF" == "refs/tags/latest" ]]; then
            git fetch origin main --tags
            main_sha="$(git rev-parse HEAD)"
            trigger_sha="$(git rev-parse "$GITHUB_SHA^{commit}")"
            if [[ "$main_sha" == "$trigger_sha" ]]; then
              release_tag="$(python3 scripts/release_version.py bump --kind "$RELEASE_KIND")"
              if git show-ref --verify --quiet "refs/tags/$release_tag"; then
                echo "Release tag $release_tag already exists; refusing to overwrite" >&2
                exit 1
              fi
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add moon.mod cmd/turtles/config.mbt
              git commit -m "chore(release): bump to $release_tag"
              git tag "$release_tag"
              git push --atomic origin HEAD:refs/heads/main "refs/tags/$release_tag"
              release_ref="$(git rev-parse HEAD)"
            else
              # Re-running a failed release must not bump the version twice.
              release_tag="$(python3 scripts/release_version.py read --kind "$RELEASE_KIND")"
              if [[ "$(git rev-parse HEAD^)" != "$trigger_sha" ]] ||
                 [[ "$(git log -1 --format=%s)" != "chore(release): bump to $release_tag" ]] ||
                 [[ "$(git rev-parse "refs/tags/$release_tag^{commit}" 2>/dev/null || true)" != "$main_sha" ]]; then
                echo "latest must point at main HEAD; move latest to current main and push it" >&2
                exit 1
              fi
              release_ref="$main_sha"
            fi
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release_tag="$GITHUB_REF_NAME"
            python3 scripts/release_version.py check-tag --kind "$RELEASE_KIND" --tag "$release_tag"
          fi
          echo "release_ref=$release_ref" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
          - os: macos-15
            platform: darwin-aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ needs.prepare.outputs.release_ref }}
      - uses: hustcer/setup-moonbit@v1
      - name: Resolve dependencies
        run: |
          moon update
          moon install
      - name: Build MoonBit native executable
        run: moon build cmd/turtles --target native --release
      - name: Package raw release asset
        shell: bash
        run: |
          set -euo pipefail
          binaries=$(find _build/native/release/build -type f -name 'turtles.exe' -print)
          count=$(printf '%s\n' "$binaries" | grep -c . || true)
          if [ "$count" -ne 1 ]; then
            printf 'Expected exactly one turtles.exe, got %s\n' "$count" >&2
            exit 1
          fi
          mkdir -p release
          cp -- "$binaries" "release/turtles-${{ matrix.platform }}"
          chmod 755 "release/turtles-${{ matrix.platform }}"
          test -s "release/turtles-${{ matrix.platform }}"
      - name: Smoke check
        shell: bash
        run: |
          set -euo pipefail
          "./release/turtles-${{ matrix.platform }}" --help
          expected="$(python3 scripts/release_version.py read --kind turtles)"
          "./release/turtles-${{ matrix.platform }}" --version | grep -Fx "turtles ${expected#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push' && needs.prepare.outputs.release_tag != ''
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: release
          merge-multiple: true
      - name: Publish verified GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          test "$(find release -type f | wc -l)" -eq 3
          gh release create "$RELEASE_TAG" release/* --verify-tag --generate-notes --title "$RELEASE_TAG"
