name: CI

on:
  push:
  pull_request:

jobs:
  moonbit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Update dependencies
        run: moon update
      - name: Check formatting
        run: moon fmt --check
      - name: Assert version consistency
        run: |
          mod_version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' moon.mod)
          cli_version=$(sed -n 's/.*turtles_version *: *String *= *"\(.*\)".*/\1/p' cmd/turtles/config.mbt)
          if [ -z "$mod_version" ] || [ -z "$cli_version" ]; then
            echo "failed to extract version: moon.mod='$mod_version' turtles_version='$cli_version'"
            exit 1
          fi
          if [ "$mod_version" != "$cli_version" ]; then
            echo "moon.mod version ($mod_version) != turtles_version ($cli_version)"
            exit 1
          fi
      - name: Validate publishable package
        run: moon package --list
      - name: Check
        run: moon check --target native --deny-warn
      - name: Unit tests
        run: moon test --target native
      - name: Offline verification-profile adversarial tests
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Run fixture baseline
        run: moon -C fixtures/basic test
      - name: Run isolation fixture baseline
        run: moon -C fixtures/isolation test
      - name: Run empty fixture baseline
        run: moon -C fixtures/empty test
      - name: Run boundary fixture baseline
        run: moon -C fixtures/boundary test
      - name: Run turtles against fixture
        run: |
          report="$RUNNER_TEMP/turtles-report.json"
          moon run cmd/turtles -- --dir fixtures/basic --timeout 30 --json "$report"
          python - "$report" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)

          assert report["schema"] == 3
          assert len(report["mutants"]) == 6
          assert any(
              mutant["original"] == "flag" and mutant["replacement"] == "true"
              for mutant in report["mutants"]
          )
          assert any(
              mutant["original"] == "flag" and mutant["replacement"] == "false"
              for mutant in report["mutants"]
          )
          assert report["summary"]["survived"] == 0
          assert report["summary"]["timeout"] == 0
          assert all("duration_ms" in mutant for mutant in report["mutants"])
          PY
      - name: Boundary group is opt-in and classifies equality-only mutants
        run: |
          # The default run stays unchanged: it never emits a boundary row.
          # Only comparison inversions are generated; comparisons.mbt has
          # four of them and the fixture tests kill all four.
          default_report="$RUNNER_TEMP/turtles-boundary-default.json"
          moon run cmd/turtles -- --dir fixtures/boundary --timeout 60 \
            --json "$default_report"
          python - "$default_report" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)

          assert report["schema"] == 3
          assert len(report["mutants"]) == 4
          assert {m["group"] for m in report["mutants"]} == {"comparison"}
          assert report["summary"]["killed"] == 4
          PY
          # --operators boundary generates only the four equality-only
          # mutants; the two the tests do not check survive, so exit is 1.
          boundary_out="$RUNNER_TEMP/turtles-boundary-out"
          report="$RUNNER_TEMP/turtles-boundary-report.json"
          status=0
          moon run cmd/turtles -- --dir fixtures/boundary --operators boundary \
            --timeout 60 --output-dir "$boundary_out" --json "$report" \
            || status=$?
          test "$status" -eq 1
          moon run scripts/verify-boundary.mbtx -- "$report"
          # comparison,boundary generates both edits at every position: the
          # four comparison inversions are all killed, and the same two
          # boundary mutants survive as in the boundary-only run.
          combined="$RUNNER_TEMP/turtles-boundary-combined.json"
          status=0
          moon run cmd/turtles -- --dir fixtures/boundary \
            --operators comparison,boundary --timeout 60 \
            --output-dir "$RUNNER_TEMP/turtles-boundary-combined-out" \
            --json "$combined" || status=$?
          test "$status" -eq 1
          python - "$combined" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)

          rows = [(m["line"], m["group"], m["outcome"]) for m in report["mutants"]]
          assert len(rows) == 8, rows
          # At each position the comparison mutant comes first.
          for i in range(0, 8, 2):
              assert rows[i][1] == "comparison", rows
              assert rows[i + 1][1] == "boundary", rows
              assert rows[i][0] == rows[i + 1][0], rows
          boundary = [row for row in rows if row[1] == "boundary"]
          assert [row[2] for row in boundary] == [
              "SURVIVED",
              "KILLED",
              "SURVIVED",
              "KILLED",
          ], boundary
          assert report["summary"]["killed"] == 6, report["summary"]
          assert report["summary"]["survived"] == 2, report["summary"]
          PY
      - name: Verify GNU timeout classification and iteration
        run: python3 scripts/timeout_smoke.py
      - name: Run turtles against isolation fixture
        run: |
          report="$RUNNER_TEMP/turtles-isolation-report.json"
          status=0
          moon run cmd/turtles -- --dir fixtures/isolation --timeout 60 --json "$report" || status=$?
          test "$status" -eq 1
          parallel="$RUNNER_TEMP/turtles-isolation-parallel.json"
          status=0
          moon run cmd/turtles -- --dir fixtures/isolation --timeout 60 --jobs 4 --json "$parallel" || status=$?
          test "$status" -eq 1
          python - "$report" "$parallel" <<'PY'
          import json
          import sys

          def key(mutant):
              return (
                  mutant["path"],
                  mutant["line"],
                  mutant["column"],
                  mutant["original"],
                  mutant["replacement"],
                  mutant["outcome"],
                  mutant["group"],
              )

          reports = []
          for path in sys.argv[1:]:
              with open(path, encoding="utf-8") as handle:
                  reports.append(json.load(handle))
          for report in reports:
              summary = report["summary"]
              assert summary["killed"] == 3, summary
              assert summary["survived"] == 3, summary
              assert summary["unviable"] == 0, summary
              assert summary["timeout"] == 0, summary
              assert report["schema"] == 3
              assert all("group" in mutant for mutant in report["mutants"])
          sequential = [key(m) for m in reports[0]["mutants"]]
          concurrent = [key(m) for m in reports[1]["mutants"]]
          assert sequential == concurrent  # parallel runs keep discovery order
          PY
      - name: Target-aware runs on the targets fixture
        run: |
          # --list filters by Moon's own per-backend plan: native lists
          # common+native, js lists common+js, all unions them.
          moon run cmd/turtles -- --dir fixtures/targets --target native --list \
            | tee "$RUNNER_TEMP/turtles-list-native.txt"
          grep -q 'common.mbt:' "$RUNNER_TEMP/turtles-list-native.txt"
          grep -q 'native_only.mbt:' "$RUNNER_TEMP/turtles-list-native.txt"
          ! grep -q 'js_only.mbt:' "$RUNNER_TEMP/turtles-list-native.txt"
          grep -q 'target-inactive: js_only.mbt' "$RUNNER_TEMP/turtles-list-native.txt"
          moon run cmd/turtles -- --dir fixtures/targets --target js --list \
            | tee "$RUNNER_TEMP/turtles-list-js.txt"
          grep -q 'common.mbt:' "$RUNNER_TEMP/turtles-list-js.txt"
          grep -q 'js_only.mbt:' "$RUNNER_TEMP/turtles-list-js.txt"
          ! grep -q 'native_only.mbt:' "$RUNNER_TEMP/turtles-list-js.txt"
          moon run cmd/turtles -- --dir fixtures/targets --target all --list \
            | tee "$RUNNER_TEMP/turtles-list-all.txt"
          grep -q 'common.mbt:' "$RUNNER_TEMP/turtles-list-all.txt"
          grep -q 'native_only.mbt:' "$RUNNER_TEMP/turtles-list-all.txt"
          grep -q 'js_only.mbt:' "$RUNNER_TEMP/turtles-list-all.txt"
          # A native run classifies common+native mutants; js mutants are
          # reported target-inactive and excluded from the score.
          report="$RUNNER_TEMP/turtles-targets.json"
          out="$RUNNER_TEMP/turtles-targets-out"
          status=0
          moon run cmd/turtles -- --dir fixtures/targets --target native --timeout 60 \
            --json "$report" --output-dir "$out" || status=$?
          test "$status" -eq 1  # intentional equivalent-mutant survivors -> exit 1
          python - "$report" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)

          assert report["schema"] == 3
          assert report["target"] == "native"
          assert report["inactive_mutants"] == 1
          assert report["inactive_files"] == ["js_only.mbt"]
          assert all(
              mutant["path"] in ("common.mbt", "native_only.mbt")
              for mutant in report["mutants"]
          )
          # common_keep/native_keep are intentional equivalent mutants that
          # survive for the PBT analyses; the rest must be killed.
          assert report["summary"]["killed"] == len(report["mutants"]) - 2
          assert report["summary"]["survived"] == 2
          PY
          # A js run with --iterate against the same output dir must not
          # reuse a single native verdict: prior.target mismatches.
          moon run cmd/turtles -- --dir fixtures/targets --target js --iterate \
            --timeout 60 --output-dir "$out" 2>&1 \
            | tee "$RUNNER_TEMP/turtles-iterate-js.txt"
          grep -q "reusing 0/" "$RUNNER_TEMP/turtles-iterate-js.txt"
      - name: PBT survivor analyses on the pbt fixture
        run: |
          # fixtures/pbt exercises every branch of --emit-properties,
          # --pbt-witness and --pbt-amplify: effects-unknown (Ref state),
          # recursive (self + mutual), witness "none" (equivalent mutants),
          # falsified witnesses, collision-safe naming, and an
          # amplification-only kill.
          report="$RUNNER_TEMP/turtles-pbt.json"
          moon run cmd/turtles -- --dir fixtures/pbt --timeout 120             --emit-properties --pbt-witness --pbt-amplify 4             --json "$report" || status=$?
          test "${status:-0}" -eq 1  # survivors -> exit 1
          python - "$report" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)

          mutants = report["mutants"]
          amplified = [m for m in mutants if m.get("amplified")]
          assert len(amplified) == 1, amplified
          assert amplified[0]["outcome"] == "KILLED"
          assert "witness" not in amplified[0]
          assert "witness_skipped" not in amplified[0]
          survivors = [m for m in mutants if m["outcome"] == "SURVIVED"]
          skips = {m.get("witness_skipped") for m in survivors}
          assert "effects-unknown" in skips, skips
          assert "recursive" in skips, skips
          witnesses = {m.get("witness") for m in survivors}
          assert "none" in witnesses, witnesses
          assert any(
              w not in (None, "none") for w in witnesses
          ), "expected at least one falsified witness"
          props = report["properties"]
          assert all(p.startswith("properties/") for p in props), props
          assert all(
              p.endswith(".mbt") for p in props
          ), props
          assert len(props) >= 1, props
          PY
          ls fixtures/pbt/.turtles/properties/*.mbt | head -1 | xargs head -2
          # a default run emits none of the PBT fields
          moon run cmd/turtles -- --dir fixtures/pbt --timeout 120             --json "$RUNNER_TEMP/turtles-pbt-default.json" || status=$?
          test "${status:-0}" -eq 1
          python - "$RUNNER_TEMP/turtles-pbt-default.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)
          assert "properties" not in report
          assert all(
              "witness" not in m and "witness_skipped" not in m
              and "amplified" not in m
              for m in report["mutants"]
          )
          PY
      - name: PBT analyses on the targets fixture
        run: |
          # Target switch: native-only suggestions are swept by the js run;
          # --target all compiles the witness harness on every backend.
          out="$RUNNER_TEMP/turtles-targets-pbt"
          moon run cmd/turtles -- --dir fixtures/targets --target native             --emit-properties --output-dir "$out" --timeout 60 || test $? -eq 1
          ls "$out/properties/" | tee "$RUNNER_TEMP/props-native.txt"
          moon run cmd/turtles -- --dir fixtures/targets --target js             --emit-properties --output-dir "$out" --timeout 60 || test $? -eq 1
          ls "$out/properties/" | tee "$RUNNER_TEMP/props-js.txt"
          python - "$RUNNER_TEMP/props-native.txt" "$RUNNER_TEMP/props-js.txt" <<'PY'
          import sys

          def names(path):
              with open(path, encoding="utf-8") as handle:
                  return {line.strip() for line in handle if line.strip()}

          native = names(sys.argv[1])
          js = names(sys.argv[2])
          assert len(js) == 1, js
          assert len(native - js) == 1, (native, js)
          PY
          moon run cmd/turtles -- --dir fixtures/targets --target all             --pbt-witness --timeout 60             --json "$RUNNER_TEMP/turtles-all.json" || test $? -eq 1
          python - "$RUNNER_TEMP/turtles-all.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)
          assert all(
              m["outcome"] != "UNVIABLE" for m in report["mutants"]
          ), "witness harness must compile on every backend"
          survivors = [m for m in report["mutants"] if m["outcome"] == "SURVIVED"]
          assert survivors, "expected survivors"
          assert all(
              m.get("witness") == "none" and "witness_skipped" not in m
              for m in survivors
          ), survivors
          assert any(
              m["path"] == "native_only.mbt" for m in survivors
          ), "native-only survivor expected under --target all"
          PY
      - name: PBT regression acceptance
        run: python3 scripts/pbt_acceptance.py
      - name: fail-under gates on the mutation score
        run: |
          # The isolation fixture scores 50%: a threshold at the score passes
          # despite the survivors, and one above it fails.
          moon run cmd/turtles -- --dir fixtures/isolation --timeout 60 --fail-under 50
          status=0
          moon run cmd/turtles -- --dir fixtures/isolation --timeout 60 --fail-under 51 || status=$?
          test "$status" -eq 1
          status=0
          moon run cmd/turtles -- --dir fixtures/isolation --timeout 60 --fail-under -1 || status=$?
          test "$status" -eq 2
          status=0
          moon run cmd/turtles -- --dir fixtures/isolation --timeout 60 --fail-under 101 || status=$?
          test "$status" -eq 2
      - name: Smoke-test the installed binary
        run: |
          bin="$RUNNER_TEMP/turtles-bin"
          moon install ./cmd/turtles --bin "$bin"
          "$bin/turtles" --version
          "$bin/turtles" --help
          "$bin/turtles" --dir fixtures/basic --list
      - name: Smoke-test the published Mooncakes release
        # The version in moon.mod may not be published yet (e.g. a release
        # bump PR before `moon publish`). Skipping in that case keeps PR CI
        # green without requiring a pre-merge registry publication; once the
        # version exists, any CI run verifies the published artifact.
        run: |
          mod_version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' moon.mod)
          curl -fsSL "https://mooncakes.io/api/v0/modules/f4ah6o/turtles" \
            -o "$RUNNER_TEMP/mooncakes.json"
          if jq -e --arg v "$mod_version" \
              '.versions[] | select(.version == $v and (.yanked | not))' \
              "$RUNNER_TEMP/mooncakes.json" > /dev/null; then
            bin="$RUNNER_TEMP/turtles-mooncakes-bin"
            moon install "f4ah6o/turtles/cmd/turtles@$mod_version" --bin "$bin"
            test "$("$bin/turtles" --version)" = "turtles $mod_version"
          else
            echo "f4ah6o/turtles@$mod_version is not published yet; skipping"
          fi
      - name: Emit JSON report for empty candidate sets
        run: |
          report="$RUNNER_TEMP/turtles-empty-report.json"
          moon run cmd/turtles -- --dir fixtures/empty --json "$report"
          filtered="$RUNNER_TEMP/turtles-filtered-report.json"
          moon run cmd/turtles -- --dir fixtures/basic --file no-such-source --json "$filtered"
          python - "$report" "$filtered" <<'PY'
          import json
          import sys

          for path in sys.argv[1:]:
              with open(path, encoding="utf-8") as handle:
                  report = json.load(handle)
              assert report["schema"] == 3
              assert report["mutants"] == []
              assert report["summary"]["killed"] == 0
              assert report["summary"]["survived"] == 0
              assert report["summary"]["timeout"] == 0
              assert report["summary"]["unviable"] == 0
              assert int(report["baseline_duration_ms"]) >= 0
          PY
      - name: List self-mutation candidates
        run: moon run cmd/turtles -- --dir . --list
      - name: Self-mutation dogfood on fingerprint.mbt
        # Arithmetic - -> + in fingerprint_hex can grow until OOM or the
        # command deadline; neither is a deterministic test kill. Keep the
        # finite comparison kill here and verify TIMEOUT separately with
        # timeout_smoke.py's deliberately endless loop and finite control.
        run: |
          report="$RUNNER_TEMP/turtles-self-report.json"
          moon run cmd/turtles -- --dir . \
            --file cmd/turtles/fingerprint.mbt --operators comparison \
            --jobs 4 --timeout 60 --json "$report"
          python - "$report" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)

          assert report["schema"] == 3
          assert len(report["mutants"]) == 1
          mutant = report["mutants"][0]
          assert (mutant["original"], mutant["replacement"], mutant["group"]) == (">=", "<", "comparison")
          assert mutant["outcome"] == "KILLED"
          assert report["summary"]["killed"] == 1, report["summary"]
          assert report["summary"]["survived"] == 0, report["summary"]
          assert report["summary"]["timeout"] == 0, report["summary"]
          assert report["summary"]["unviable"] == 0, report["summary"]
          PY
      - name: Binary self-verification e2e
        run: sh scripts/self_e2e.sh

  macos-native:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Update dependencies
        run: moon update
      - name: Check formatting
        run: moon fmt --check
      - name: Assert version consistency
        run: |
          mod_version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' moon.mod)
          cli_version=$(sed -n 's/.*turtles_version *: *String *= *"\(.*\)".*/\1/p' cmd/turtles/config.mbt)
          test "$mod_version" = "$cli_version"
      - name: Check native target
        run: moon check --target native --deny-warn
      - name: Install GNU coreutils for timeout regression
        run: |
          brew install coreutils
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          test -x /opt/homebrew/bin/gtimeout
      - name: Unit tests on Darwin
        run: moon test --target native
      - name: Verify Homebrew gtimeout classification and iteration
        run: python3 scripts/timeout_smoke.py
      - name: Run native mutation fixture without GNU timeout
        shell: bash
        run: |
          set -euo pipefail
          fallback_path="$HOME/.moon/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          if PATH="$fallback_path" /bin/sh -c 'command -v timeout >/dev/null 2>&1 || command -v gtimeout >/dev/null 2>&1'; then
            echo "expected the Darwin process-group timeout fallback to be exercised" >&2
            exit 1
          fi
          report="$RUNNER_TEMP/turtles-report.json"
          PATH="$fallback_path" moon run cmd/turtles -- --dir fixtures/basic --timeout 30 --json "$report"
          expected_version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' moon.mod)
          test -n "$expected_version"
          python3 - "$report" "$expected_version" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)

          assert report["schema"] == 3
          assert report["turtles_version"] == sys.argv[2]
          assert len(report["mutants"]) == 6
          assert report["summary"]["killed"] == 6
          assert report["summary"]["survived"] == 0
          assert report["summary"]["timeout"] == 0
          assert all("duration_ms" in mutant for mutant in report["mutants"])
          PY
      - name: Verify Darwin timeout and cancellation descendant cleanup
        run: python3 scripts/darwin_timeout_smoke.py

  windows-native:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: hustcer/setup-moonbit@v1
        with:
          version: '0.10.16+b1a0e846e'
          core-version: '0.10.16+b1a0e846e'
      - name: Record pinned toolchain
        run: moon version --all
      - name: Resolve dependencies
        run: moon update
      - name: Check version consistency
        run: python scripts/release_version.py read --kind turtles
      - name: Check formatting
        run: moon fmt --check
      - name: Check native target
        run: moon check --target native --deny-warn
      - name: Test native target
        run: moon test --target native
      - name: Run release guard tests
        run: python -m unittest discover -s scripts/tests -p 'test_release_*.py' -v
      - name: Test Windows smoke process tracking
        run: python -m unittest discover -s scripts/tests -p 'test_windows_smoke.py' -v
      - name: Run native fixtures, parallel workers, and target filtering
        run: python scripts/windows_smoke.py

  mbtx-validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Update MoonBit registry
        run: moon update
      - name: Check standalone MoonBit validator formatting
        run: |
          moon fmt scripts/self_report.mbtx --check
          moon fmt scripts/verify-boundary.mbtx --check
      - name: Test standalone MoonBit validators
        run: |
          moon test scripts/self_report.mbtx
          moon test scripts/verify-boundary.mbtx
      - name: Run Python-free binary self-E2E
        shell: bash
        run: |
          set -euo pipefail
          blocked="$(mktemp -d)"
          trap 'rm -rf "$blocked"' EXIT
          for exe in python python3 py; do
            printf '%s\n' '#!/bin/sh' ': > "$(dirname "$0")/invoked"' 'echo "unexpected Python invocation" >&2' 'exit 97' > "$blocked/$exe"
            chmod +x "$blocked/$exe"
          done
          PATH="$blocked:$PATH" sh scripts/self_e2e.sh
          test ! -e "$blocked/invoked"

  published-cli-no-checkout:
    timeout-minutes: 20
    env:
      TURTLES_RELEASE_VERSION: 0.4.7
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        install: [registry, native-asset]
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            executable: turtles
            sha256: 5b8e342a3362e2239d261615733a0267081accdf5c838466cd390a5ec8c8c411
          - os: macos-15
            platform: darwin-aarch64
            executable: turtles
            sha256: 4bcb1140e889cf11e87dd4eae484951e754d8f58ba4cc442cdc2ba7f20b4d685
          - os: windows-2025
            platform: windows-x86_64.exe
            executable: turtles.exe
            sha256: 31032520584df4fb5fa720f233d135609b8d4b3c8394936fa27b794f428d38ca
    runs-on: ${{ matrix.os }}
    steps:
      # A checkout would hide accidental dependencies on contributor scripts.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Quarantine the optional compiler telemetry helper in this disposable runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = (Get-Command cl.exe -ErrorAction Stop).Source
          $helper = Join-Path (Split-Path $compiler) 'vctip.exe'
          if (Test-Path -LiteralPath $helper) {
            Move-Item -LiteralPath $helper -Destination "$helper.turtles-ci-disabled" -ErrorAction Stop
          }
          if (Test-Path -LiteralPath $helper) {
            throw 'The optional MSVC telemetry helper is still available'
          }
          Write-Host 'Consumer gate environment: MSVC vctip helper unavailable; compiler and linker retained'
      - uses: hustcer/setup-moonbit@v1
      - name: Verify Apple Silicon runner
        if: runner.os == 'macOS'
        shell: bash
        run: test "$(uname -m)" = arm64
      - name: Install and run standalone consumer fixture with Python blocked
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .git
          test ! -e moon.mod
          temp="$(mktemp -d)"
          trap 'rm -rf "$temp"' EXIT
          mkdir -p "$temp/module" "$temp/no-python" "$temp/bin"
          for exe in python python3 py; do
            printf '%s\n' '#!/bin/sh' ': > "$(dirname "$0")/invoked"' 'echo "unexpected Python invocation" >&2' 'exit 97' > "$temp/no-python/$exe"
            chmod +x "$temp/no-python/$exe"
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              printf '%s\r\n' '@echo off' 'echo invoked>"%~dp0invoked"' 'echo unexpected Python invocation 1>&2' 'exit /b 97' > "$temp/no-python/$exe.cmd"
            fi
          done
          export PATH="$temp/no-python:$PATH"
          cd "$temp/module"
          moon version --all
          moon update
          asset="$temp/bin/${{ matrix.executable }}"
          echo "Installing $TURTLES_RELEASE_VERSION via ${{ matrix.install }}"
          if [[ "${{ matrix.install }}" == "registry" ]]; then
            moon install "f4ah6o/turtles/cmd/turtles@$TURTLES_RELEASE_VERSION" --bin "$temp/bin"
          else
            curl -fsSL "https://github.com/gpui-mbt/turtles.mbt/releases/download/v$TURTLES_RELEASE_VERSION/turtles-${{ matrix.platform }}" -o "$asset"
            if [[ "$RUNNER_OS" == "macOS" ]]; then
              echo "${{ matrix.sha256 }}  $asset" | shasum -a 256 -c -
            else
              echo "${{ matrix.sha256 }}  $asset" | sha256sum -c -
            fi
            chmod +x "$asset"
          fi
          test "$("$asset" --version)" = "turtles $TURTLES_RELEASE_VERSION"
          "$asset" --help
          cat > moon.mod <<'MOD'
          name = "smoke/clone_free"
          version = "0.1.0"
          preferred_target = "native"
          MOD
          touch moon.pkg
          cat > plus.mbt <<'MBT'
          ///|
          pub fn plus(a : Int32, b : Int32) -> Int32 {
            a + b
          }
          MBT
          cat > plus_test.mbt <<'MBT'
          ///|
          test "plus" {
            inspect(plus(1, 2), content="3")
          }
          MBT
          echo "Running published CLI against the cold consumer fixture"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cat > "$temp/consumer.ps1" <<'PS1'
          param([string]$Cli, [string]$Module, [string]$Report, [string]$Runtime)
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path $Runtime -Force | Out-Null
          $env:TMP = $Runtime
          $env:TEMP = $Runtime
          $env:TMPDIR = $Runtime
          $start = [System.Diagnostics.ProcessStartInfo]::new()
          $start.FileName = $Cli
          $start.WorkingDirectory = $Module
          $start.UseShellExecute = $false
          foreach ($argument in @('--dir', '.', '--timeout', '60', '--json', $Report)) {
            $start.ArgumentList.Add($argument)
          }
          $consumerProcess = [System.Diagnostics.Process]::Start($start)
          if (-not $consumerProcess.WaitForExit(120000)) {
            $processes = @(Get-CimInstance Win32_Process)
            $ownedIds = [System.Collections.Generic.HashSet[uint32]]::new()
            $null = $ownedIds.Add([uint32]$consumerProcess.Id)
            do {
              $added = $false
              foreach ($candidate in $processes) {
                if ($ownedIds.Contains([uint32]$candidate.ParentProcessId)) {
                  if ($ownedIds.Add([uint32]$candidate.ProcessId)) { $added = $true }
                }
              }
            } while ($added)
            $processes | Where-Object { $ownedIds.Contains([uint32]$_.ProcessId) } |
              Select-Object ProcessId, ParentProcessId, Name, ExecutablePath |
              Format-Table -AutoSize | Out-String | Write-Host
            Write-Host 'Toolchain candidates with unconfirmed ownership (parents may have exited):'
            $processes | Where-Object { $_.Name -match '^(moon|moonc|cl|link|vctip|mspdbsrv)\.exe$' } |
              Select-Object ProcessId, ParentProcessId, Name, ExecutablePath |
              Format-Table -AutoSize | Out-String | Write-Host
            Get-ChildItem -Path $Runtime -Recurse -Filter '*moon-output.log' |
              ForEach-Object { Write-Host $_.FullName; Get-Content $_.FullName -Tail 80 }
            $consumerProcess.Kill($true)
            $null = $consumerProcess.WaitForExit(10000)
            throw 'Cold consumer fixture exceeded the 120-second CI diagnostic deadline'
          }
          exit $consumerProcess.ExitCode
          PS1
            pwsh -NoProfile -File "$(cygpath -w "$temp/consumer.ps1")" \
              -Cli "$(cygpath -w "$asset")" -Module "$(cygpath -w "$temp/module")" \
              -Report "$(cygpath -w "$temp/report.json")" -Runtime "$(cygpath -w "$temp/runtime")"
          else
            "$asset" --dir . --timeout 60 --json "$temp/report.json"
          fi
          jq -e --arg v "$TURTLES_RELEASE_VERSION" '.schema == 3 and .turtles_version == $v and (.mutants | length) == 1 and
            .mutants[0].outcome == "KILLED" and .summary.killed == 1 and .summary.survived == 0 and
            .summary.timeout == 0 and .summary.unviable == 0' "$temp/report.json"
          test ! -e "$temp/no-python/invoked"
